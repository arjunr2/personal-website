# Gallery page. Tiles are shown in the order below.
#   title:   bold line under the tile (inline Markdown, e.g. a [link](https://...), works here and in caption)
#   caption: short line under the title
#   image:   { src, alt }; plate: true for a small graphic, shown on a card instead of filling the tile
#   icon:    for a tile without an image, from templates/icons.json
#   images:  several pictures in one wider tile, [{ src, alt }, ...]; the first is shown large. An .mp4 plays as a silent loop
#   size:    optional tile width [columns of 12 on desktop, columns of 6 on tablet]; default [3, 3]; with images: [6, 6], or a full row for 4 or more
#   videos:  YouTube videos instead of an image, [{ title, url }]; several share one wider tile, side by side
#   text:    shown over the picture on hover (below it on phones); Markdown

title: Gallery
