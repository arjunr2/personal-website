  - id: recycleme-createathon-2019
    title: RecycleMe (CreateAThon 2019)
    size: [6, 6]
    team: Team of 5
    image: { src: /assets/projects/TeamTrash.png, alt: The RecycleMe trash-sorter prototype }
    image_style: photo
    image_beside: true
    zoom: 1.14
    links:
      - { label: Presentation, icon: document, url: 'https://docs.google.com/presentation/d/1hpvU2TW-b8DZ-9Plj63A9ec2fWhC68u3J7fawatYcz0/edit#slide=id.g6349289ee8_0_57' }
      - { label: System Code, icon: github, url: 'https://github.com/yashparakh111/createathon2019' }
      - { label: Mobile App, icon: github, url: 'https://github.com/yashparakh111/RecycleMe' }
    text: |
      * A smart autonomous trash-sorter to sort Recyclable, Landfill, and Compostable materials. 
      * RPi control and vision-based CNN offsite for real-time segregation.
      * Built a mobile app to crowd-source the gathering and labelling of real-world dataset

  - id: chairiot-createathon-2018
    title: ChairIoT (CreateAThon 2018)
    size: [6, 6]
    team: Team of 5
    image: { src: /assets/projects/Chair1_crop.jpg, alt: The ChairIoT self-organizing chair platform }
    image_style: photo
    image_beside: true
    links:
      - { label: Proposal, icon: document, url: 'https://drive.google.com/file/d/1ro5dI3SfT6lGEWr6IyF8sTGZJdI4XTpq/view?usp=sharing' }
      - { label: Code, icon: github, url: 'https://github.com/yashparakh111/Self-Organizing-Chair' }
    text: |
      A self-organizing chair platform using Rpi for control. Uses an IMU and Kalman filters
      to compute net displacement from time-series acceleration data.

