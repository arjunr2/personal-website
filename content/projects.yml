# Build Hub page. Projects are listed in the order below.
#   id:           the anchor (/projects/#<id>); the home page's `mosaic` names projects by id
#   team:         "Solo" or "Team of N"
#   image:        optional { src, alt }; image_style: photo fills its box, plate (default) shows a logo on white
#   size:         optional tile width [columns of 12 on desktop, columns of 6 on tablet], default [4, 3]
#   image_beside: true puts the image left of the text; zoom: crops into a photo (e.g. 1.1)
#   text:         the bullet list (Markdown)

title: Build Hub
accent: projects
icon: layers

items:
  - id: extending-the-risc-v-isa
    title: Extending the RISC-V ISA
    team: Team of 2
    image: { src: /assets/projects/RISCV_Logo.png, alt: RISC-V logo }
    size: [6, 6]
    image_beside: true
    links:
      - { label: Presentation, icon: video, url: 'https://vimeopro.com/utece/capstone2021spring/video/543700201' }
      - { label: Design, icon: document, url: 'https://docs.google.com/document/d/1Ygt9UbJ5kYmJLXBvFtrCkNEAzlkYbvzGRgO9i6_9oP4/edit?usp=sharing' }
      - { label: Code, icon: github, url: 'https://github.com/Patt-Senior-Design/core-design' }
    text: |
      * Custom synthesizable Verilog implementation of RV32-IM core and memory hierarchy
      * Added ISA + Microarchitectural extensions to accelerate:
          * Searching in Linear-Probed Hashsets (up to 10x speedup on high load-factors)
          * Breadth-First Search (average 2x speedup)

  - id: jasp-cellular-phone
    title: 'JASP: Bare-Metal Embedded Cellular Phone'
    team: Team of 4
    image: { src: /assets/projects/JASP2.jpg, alt: The JASP cellular phone prototype }
    size: [6, 6]
    image_style: photo
    image_beside: true
    links:
      - { label: Code, icon: github, url: 'https://github.com/JASP-EE445L-Fall19/Phone_4C123' }
    text: |
      * On TM4C123 microcontroller built with a total cost < $50
          * Fully call+text capable
          * Real-time clock + numpad
          * LCD with [*LVGL*](https://lvgl.io/) UI
      * Voted best project during class (EE 445L) project showcase
      * Integrates a LCD, real-time clock, and numpad on a TM4C123 microcontroller

  - id: rtos-design
    title: Bare-Metal RTOS Design
    team: Team of 2
    image: { src: /assets/projects/RTOS2.png, alt: TM4C123 microcontroller board with an LCD showing a battleship grid }
    size: [7, 6]
    image_style: photo
    image_beside: true
    links:
      - { label: Demo, icon: video, url: 'https://www.youtube.com/watch?v=N1q2bLxdYYM' }
    text: |
      * On a TM4C123 microcontroller with:
          * Real-time priority scheduler + thread/process management
          * FAT32 file system and memory management
          * Supports remote-procedure calls (RPC) over wireless. 
      * Built a two-player remote battleship application over this

  - id: xc2064-fpga-design
    title: XC2064 FPGA Design
    team: Team of 3
    image: { src: /assets/projects/FPGA.jpg, alt: Die photograph of the XC2064 FPGA }
    size: [5, 6]
    image_style: photo
    image_beside: true
    links:
      - { label: Reference Article, icon: document, url: 'https://www.righto.com/2020/09/reverse-engineering-first-fpga-chip.html' }
